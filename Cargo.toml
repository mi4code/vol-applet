[package]
name = "volapplet"
version = "0.2.2"
edition = "2021"

[dependencies]
# Use gtk 0.15.x so it matches gtk-layer-shell's gtk dependency and
# avoids multiple crates linking to the same native gtk-3 library.
# Note: API differences between gtk 0.16 and 0.15 are minimal, but this
# change may require adjusting imports elsewhere. Ensure you `cargo test`.
gtk = "0.15.4"
gtk-sys = "0.15.3"
gdk-sys = "0.15.3"
gobject-sys = "0.16.3"
libpulse-sys = "1.20.1"
once_cell = "1.17.1"
owo-colors = "3.5.0"

# Wayland placement support via gtk-layer-shell
gtk-layer-shell = "0.3.0"
